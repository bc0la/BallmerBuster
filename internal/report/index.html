<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BallmerBuster report</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  header { padding: 16px 24px; border-bottom: 1px solid #333; background: #181818; }
  header h1 { margin: 0 0 10px; font-size: 18px; }
  nav.sections { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  nav.sections button { background: #1d1d1d; color: #ddd; border: 1px solid #333; padding: 7px 14px; cursor: pointer; font: inherit; font-weight: 600; border-radius: 4px; }
  nav.sections button.active { background: #2a4d69; border-color: #3a6d99; color: #fff; }
  nav.sections button.fp { color: #c9a; }
  nav.sections button.fp.active { background: #5a2a4d; border-color: #8a3a6d; color: #fff; }
  nav.sections .count { opacity: .7; font-weight: 400; margin-left: 4px; }
  nav.chips { display: flex; flex-wrap: wrap; gap: 4px; }
  nav.chips button { background: #191919; color: #bbb; border: 1px solid #2a2a2a; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; border-radius: 12px; }
  nav.chips button.active { background: #24425a; border-color: #3a6d99; color: #fff; }
  nav.chips .count { opacity: .6; margin-left: 3px; }
  nav.chips:empty { display: none; }
  nav.checkbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
  nav.checkbar:empty { display: none; }
  nav.checkbar .checkbar-label { color: #888; font-size: 12px; margin-right: 2px; }
  nav.checkbar button { background: #16221a; color: #9cc; border: 1px solid #244; padding: 3px 9px; cursor: pointer; font: inherit; font-size: 12px; border-radius: 12px; }
  nav.checkbar button.off { background: #1a1a1a; color: #666; border-color: #333; text-decoration: line-through; }
  nav.checkbar button .count { opacity: .6; margin-left: 3px; }
  nav.checkbar .checkbar-clear { background: #333; color: #ccc; border: 1px solid #555; text-decoration: none; border-radius: 4px; }
  nav.checkbar .checkbar-clear:hover { background: #555; }
  nav.toptabs { display: flex; gap: 6px; margin-bottom: 10px; }
  nav.toptabs button { background: #202020; color: #ddd; border: 1px solid #333; padding: 6px 18px; cursor: pointer; font: inherit; font-weight: 600; border-radius: 4px; }
  nav.toptabs button.active { background: #2a4d69; border-color: #3a6d99; color: #fff; }
  #utils h2 { font-size: 16px; margin: 4px 0 8px; }
  #utils h3 { font-size: 13px; margin: 0 0 8px; color: #cbd; text-transform: uppercase; letter-spacing: .5px; }
  .utils-note { color: #aaa; font-size: 13px; max-width: 900px; line-height: 1.5; }
  .utils-note code, .u-card code { background: #0c0c0c; border: 1px solid #222; padding: 0 4px; border-radius: 3px; }
  .u-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 6px; padding: 14px 16px; margin: 12px 0; max-width: 920px; }
  .u-grid { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items: center; }
  .u-grid label { color: #bbb; font-size: 13px; }
  .u-grid input[type=text], .u-grid input[type=password], .u-grid input[type=number], .u-grid select, .u-card textarea {
    background: #0c0c0c; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; }
  .u-card textarea { min-height: 70px; resize: vertical; font-family: monospace; font-size: 12px; }
  .u-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .u-row label { color: #bbb; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .u-row .inline { display: inline-flex; align-items: center; gap: 6px; }
  .u-row .inline input[type=number] { width: 72px; background: #0c0c0c; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .u-hint { color: #888; font-size: 12px; margin: 4px 0; }
  .u-status { font-size: 13px; margin-bottom: 8px; }
  .u-status .ok { color: #99d98c; font-weight: 600; }
  .u-status .no { color: #ff9a3c; font-weight: 600; }
  .console { background: #0a0a0a; border: 1px solid #222; padding: 8px; max-height: 55vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 monospace; color: #d6d6d6; margin-top: 8px; border-radius: 4px; }
  .console:empty { display: none; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid #333; }
  .badge.ok { background: #16301a; color: #9cc99c; border-color: #2a5a2a; }
  .badge.no { background: #301a16; color: #cc9c9c; border-color: #5a2a2a; }
  .u-tag { display: inline-block; background: #24425a; color: #cfe; border: 1px solid #3a6d99; border-radius: 3px; padding: 1px 6px; font-size: 12px; margin: 2px; }
  .u-tag.bad { background: #3a2018; color: #f2b8a8; border-color: #7a3a2a; }
  .u-tag button { background: none; border: none; color: #9bd; cursor: pointer; font: inherit; padding: 0; }
  .dh-perdom { margin: 4px 0; }
  .dh-table-wrap { max-height: 46vh; overflow: auto; border: 1px solid #222; border-radius: 5px; margin: 8px 0; }
  .dh-table { border-collapse: collapse; width: 100%; font-size: 12px; font-family: monospace; }
  .dh-table caption.dh-cap { caption-side: top; text-align: left; color: #ff9a3c; font-family: inherit; font-size: 12px; padding: 4px 6px; }
  .dh-table th { position: sticky; top: 0; background: #1b1b1b; color: #cbd; text-align: left; padding: 5px 8px; border-bottom: 1px solid #333; white-space: nowrap; z-index: 1; }
  .dh-table td { padding: 4px 8px; border-bottom: 1px solid #191919; color: #ddd; vertical-align: top; word-break: break-all; max-width: 320px; }
  .dh-table tbody tr:nth-child(even) { background: #121212; }
  .dh-table tbody tr:hover { background: #1a2530; }
  .term { border: 1px solid #222; border-radius: 5px; margin-top: 8px; overflow: hidden; }
  .term:empty { display: none; }
  .term-bar { display: flex; align-items: center; gap: 8px; background: #141414; border-bottom: 1px solid #222; padding: 5px 8px; font-size: 12px; }
  .term-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; flex: none; }
  .term-bar.running .dot { background: #ffd166; box-shadow: 0 0 6px #ffd166; animation: pulse 1s infinite; }
  .term-bar.ok .dot { background: #99d98c; }
  .term-bar.fail .dot { background: #ff5b5b; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .term-bar .title { font-weight: 600; color: #ccc; }
  .term-bar .state { color: #999; }
  .term-bar .spacer { flex: 1; }
  .term-bar a { color: #7fb2e0; }
  .term-bar button { background: #222; color: #bbb; border: 1px solid #333; border-radius: 3px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  .term-body { background: #0a0a0a; padding: 8px; max-height: 55vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 monospace; color: #d6d6d6; }
  .term-body:empty::before { content: "— no output yet —"; color: #555; }
  .u-count { font-size: 12px; color: #8ab; margin: 2px 0 6px; }
  @media (max-width: 640px) {
    main { padding: 12px; }
    .u-card { padding: 12px; }
    .u-grid { grid-template-columns: 1fr; gap: 4px 0; }
    .u-grid label { margin-top: 6px; }
    .u-row { gap: 10px; }
    .term-body { max-height: 45vh; }
  }
  .muted { color: #888; }
  main { padding: 16px 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #222; text-align: left; vertical-align: top; overflow: hidden; text-overflow: ellipsis; }
  th { background: #1a1a1a; position: sticky; top: 0; cursor: pointer; user-select: none; }
  th .resizer { position: absolute; right: 0; top: 0; width: 5px; height: 100%; cursor: col-resize; background: transparent; }
  th .resizer:hover, th .resizer.active { background: #3a6d99; }
  tr:hover { background: #1a1a1a; }
  .sev-critical { color: #ff5b5b; font-weight: bold; }
  .sev-high     { color: #ff9a3c; font-weight: bold; }
  .sev-medium   { color: #ffd166; }
  .sev-low      { color: #99d98c; }
  .sev-info     { color: #7f8bd6; }
  /* Potential-severity rating dot stamped on section/module/check filters. */
  .rating { margin-right: 4px; font-size: 9px; vertical-align: middle; }
  .rating-critical { color: #ff5b5b; }
  .rating-high     { color: #ff9a3c; }
  .rating-medium   { color: #ffd166; }
  .rating-low      { color: #99d98c; }
  .rating-info     { color: #7f8bd6; }
  details { margin: 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #0c0c0c; padding: 8px; border: 1px solid #222; max-height: 400px; overflow: auto; }
  .summary { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary div { background: #1a1a1a; padding: 8px 14px; border: 1px solid #2a2a2a; }
  input[type=search] { background: #0c0c0c; color: #eee; border: 1px solid #333; padding: 6px 8px; width: 300px; margin-bottom: 8px; }
  .curl-block { position: relative; margin: 4px 0; }
  .curl-block code { display: block; background: #0a0a0a; color: #7ec; padding: 6px 60px 6px 8px; border: 1px solid #333; font: 12px/1.4 monospace; white-space: pre-wrap; word-break: break-all; }
  .curl-block button { position: absolute; top: 4px; right: 4px; background: #333; color: #eee; border: 1px solid #555; padding: 2px 8px; cursor: pointer; font-size: 11px; }
  .curl-block button:hover { background: #555; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .toolbar .btn { background: #2a4d69; color: #eee; border: 1px solid #3a6d99; padding: 6px 14px; cursor: pointer; font: inherit; }
  .toolbar .btn:hover { background: #3a6d99; }
  .toolbar .btn-warn { background: #693a2a; border-color: #994d3a; }
  .toolbar .btn-warn:hover { background: #994d3a; }
  .hide-btn { background: #333; color: #999; border: 1px solid #555; padding: 1px 6px; cursor: pointer; font-size: 11px; }
  .hide-btn:hover { background: #994d3a; color: #fff; border-color: #994d3a; }
  .restore-btn { background: #2a5a3a; color: #cfe; border: 1px solid #3a7d5a; padding: 1px 6px; cursor: pointer; font-size: 11px; }
  .restore-btn:hover { background: #3a7d5a; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>BallmerBuster report</h1>
  <nav class="toptabs" id="toptabs"></nav>
  <nav class="sections" id="sections"></nav>
  <nav class="chips" id="chips"></nav>
</header>
<main>
  <div id="utils" style="display:none"></div>
  <div class="summary" id="summary"></div>
  <div class="toolbar" id="toolbar">
    <input type="search" id="filter" placeholder="filter...">
    <button class="btn" id="export-curls" onclick="exportCurls()" style="display:none">Export curls</button>
    <button class="btn" id="export-raw" onclick="exportRaw()" style="display:none">Export JSON</button>
    <button class="btn" id="export-assets" onclick="exportAssets()" style="display:none">Export assets</button>
    <button class="btn btn-warn" id="restore-all" onclick="restoreAll()" style="display:none">Restore all false positives</button>
  </div>
  <nav class="checkbar" id="checkfilter"></nav>
  <div id="content"></div>
</main>
<script>
// ---- State ---------------------------------------------------------------
// All findings are loaded ONCE and every count/filter is computed client-side.
// This keeps tab switching a pure in-memory operation (snappy) and guarantees
// the tab counts always agree with the rows shown — including after findings
// are marked as false positives.
let allFindings = [];
let categories = [];            // [{key,label}] from /api/summary
const moduleCategory = {};      // module name -> category key
const moduleRating = {};        // module name -> potential-severity rating

// Potential-severity rating helpers. Each filter (section / module / check) is
// stamped with a coloured dot for the worst-case severity it can surface.
const RATING_RANK = { critical: 4, high: 3, medium: 2, low: 1, info: 0 };
function ratingOf(mod) { return moduleRating[mod] || 'medium'; }
function maxRating(mods) {
  let best = 'info';
  for (const m of mods) {
    if ((RATING_RANK[ratingOf(m)] || 0) > (RATING_RANK[best] || 0)) best = ratingOf(m);
  }
  return best;
}
function ratingDot(rating) {
  return '<span class="rating rating-' + rating + '" title="potential severity: ' + rating + '">●</span>';
}
let currentSection = '';        // '' = All | category key | '__fp__' = false positives
let currentModule = '';         // '' = all modules in section
// Check-type facets the user has toggled off. A "check" is the sub-check within
// a module (e.g. a secret-pattern hit vs a suspicious-key-name warning).
// Session-only, and applied in every view including False Positives.
const excludedChecks = new Set();

const FP_SECTION = '__fp__';

// checkKey derives a stable sub-check label for a finding. Modules that emit
// several distinct checks tag them in detail.category / detail.kind / etc.;
// single-check modules fall back to the module name.
function checkKey(f) {
  const d = f.detail || {};
  return d.category || d.kind || d.check || d.subtype || f.module;
}

// checkLabel prettifies a check key for display without changing the key itself
// (the raw key is what excludedChecks / exports match on). Azure secrets modules
// tag their findings with a small set of shared check keys so the filter bar can
// split "pattern hits" from "suspicious names" from posture findings.
// The native secrets modules tag hits with the keys below; the kingfisher-based
// secrets_scan module tags its hits "kf:<sourcetype>" — render those as readable,
// clearly kingfisher-attributed labels so the two stay visually distinct.
const CHECK_LABELS = {
  'secret_pattern':     'Secret pattern match',
  'suspicious_name':    'Suspicious key name',
  'public_ip':          'Public IP exposure',
  'password_auth':      'Password auth enabled',
  'open_trigger':       'Unauthenticated trigger',
  'stored_credentials': 'Stored credentials',
  'cloud_connection':   'Cloud provider connection',
  'kf:vm_userdata':        'VM user data (kingfisher)',
  'kf:vm_ext':             'VM extension settings (kingfisher)',
  'kf:vmss_userdata':      'Scale Set user data (kingfisher)',
  'kf:vmss_ext':           'Scale Set extension settings (kingfisher)',
  'kf:appservice_env':     'App Service settings (kingfisher)',
  'kf:appservice_connstr': 'App Service connection strings (kingfisher)',
  'kf:appservice_code':    'App Service code (kingfisher)',
  'kf:aci_env':            'Container Instance env (kingfisher)',
  'kf:arm_deploy':         'ARM deployment params (kingfisher)',
  'kf:deploy_script':      'Deployment Scripts (kingfisher)',
  'kf:automation_var':     'Automation variables (kingfisher)',
  'kf:automation_runbook': 'Automation runbooks (kingfisher)',
  'kf:automation_job':     'Automation job output (kingfisher)',
  'kf:logic_app':          'Logic App definition (kingfisher)',
  'kf:appconfig':          'App Configuration (kingfisher)',
  'kf:apim_named_value':   'APIM named values (kingfisher)',
  'kf:log_analytics':      'Log Analytics records (kingfisher)',
  'kf:blob':               'Blob Storage contents (kingfisher)',
};
function checkLabel(k) {
  if (CHECK_LABELS[k]) return CHECK_LABELS[k];
  if (k && k.indexOf('kf:') === 0) return k.slice(3).replace(/_/g, ' ') + ' (kingfisher)';
  return k;
}

// ---- False positives (client-side, per analyst) --------------------------
// Stored in localStorage keyed by finding ID. "Hiding" a finding moves it into
// the False Positives section rather than deleting it, so accidental removals
// are one Restore click away.
const HIDDEN_KEY = 'bb_hidden_findings';
function getFP() {
  try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || '{}'); } catch { return {}; }
}
function setFP(h) { localStorage.setItem(HIDDEN_KEY, JSON.stringify(h)); }
function isFP(f) { return !!getFP()[f.id]; }
function markFP(id) { const h = getFP(); h[id] = true; setFP(h); renderAll(); }
function unmarkFP(id) { const h = getFP(); delete h[id]; setFP(h); renderAll(); }
function restoreAll() {
  const h = getFP();
  // Only restore the false positives that are currently in view.
  for (const f of rowsForSection(currentSection, currentModule, true)) delete h[f.id];
  setFP(h);
  renderAll();
}

// ---- Selection & filtering ----------------------------------------------
function categoryOf(f) { return moduleCategory[f.module] || 'other'; }

// rowsForSection returns findings for a section/module selection, before the
// text filter. When forceFP is true it returns the false-positive set for the
// same section/module regardless of currentSection.
function rowsForSection(section, mod, forceFP) {
  const fp = getFP();
  const wantFP = forceFP || section === FP_SECTION;
  let rows = allFindings.filter(f => (!!fp[f.id]) === wantFP);
  if (section && section !== FP_SECTION) rows = rows.filter(f => categoryOf(f) === section);
  if (mod) rows = rows.filter(f => f.module === mod);
  return rows;
}

// applyCheckFilter drops findings whose check the user has toggled off.
function applyCheckFilter(rows) {
  if (excludedChecks.size === 0) return rows;
  return rows.filter(f => !excludedChecks.has(f._check));
}

function currentRows() {
  const base = applyCheckFilter(rowsForSection(currentSection, currentModule, false));
  const filter = document.getElementById('filter').value.toLowerCase();
  return filter ? base.filter(f => f._search.includes(filter)) : base;
}

// ---- Nav rendering -------------------------------------------------------
function renderNav() {
  const fp = getFP();
  const nonFP = allFindings.filter(f => !fp[f.id]);
  const fpCount = allFindings.length - nonFP.length;

  const allMods = Object.keys(moduleRating);
  const modsInCat = k => allMods.filter(m => moduleCategory[m] === k);

  const sections = document.getElementById('sections');
  sections.innerHTML = '';
  const mkSection = (key, label, count, isFp, rating) => {
    const b = document.createElement('button');
    if (isFp) b.className = 'fp';
    if (key === currentSection) b.classList.add('active');
    b.innerHTML = (rating ? ratingDot(rating) : '') + label + '<span class="count">' + count + '</span>';
    b.onclick = () => { currentSection = key; currentModule = ''; renderAll(); };
    sections.appendChild(b);
  };
  mkSection('', 'All', nonFP.length, false, maxRating(allMods));
  for (const c of categories) {
    mkSection(c.key, c.label, nonFP.filter(f => categoryOf(f) === c.key).length, false, maxRating(modsInCat(c.key)));
  }
  // False Positives rating reflects the worst module actually parked there.
  const fpMods = [...new Set(allFindings.filter(f => fp[f.id]).map(f => f.module))];
  mkSection(FP_SECTION, 'False Positives', fpCount, true, fpMods.length ? maxRating(fpMods) : '');

  // Module chips: only for a concrete category section (All / FP show none).
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  if (currentSection && currentSection !== FP_SECTION) {
    const mods = Object.keys(moduleCategory)
      .filter(m => moduleCategory[m] === currentSection)
      .sort();
    const mkChip = (mod, label, count, rating) => {
      const b = document.createElement('button');
      if (mod === currentModule) b.classList.add('active');
      b.innerHTML = (rating ? ratingDot(rating) : '') + label + '<span class="count">' + count + '</span>';
      b.onclick = () => { currentModule = mod; renderAll(); };
      chips.appendChild(b);
    };
    mkChip('', 'all', nonFP.filter(f => categoryOf(f) === currentSection).length, maxRating(modsInCat(currentSection)));
    for (const m of mods) mkChip(m, m, nonFP.filter(f => f.module === m).length, ratingOf(m));
  }
}

// ---- Summary + toolbar ---------------------------------------------------
function renderSummary() {
  // Severity counts reflect the current section/module and check filter
  // (excluding the text filter so numbers stay stable while typing).
  const base = applyCheckFilter(rowsForSection(currentSection, currentModule, false));
  const bySev = {};
  for (const f of base) bySev[f.severity] = (bySev[f.severity] || 0) + 1;
  const order = ['critical', 'high', 'medium', 'low', 'info'];
  const s = document.getElementById('summary');
  s.innerHTML = '';
  order.filter(k => bySev[k]).forEach(k => {
    const d = document.createElement('div');
    d.className = 'sev-' + k;
    d.textContent = k + ': ' + bySev[k];
    s.appendChild(d);
  });
}

// renderCheckFilter draws the per-check toggle bar for the current view. It is
// shown in every section and in False Positives, and only when the view holds
// more than one distinct check (otherwise there is nothing to split).
function renderCheckFilter() {
  const base = rowsForSection(currentSection, currentModule, false);
  const counts = {};
  const checkMods = {}; // check key -> set of modules that emit it (for the rating)
  for (const f of base) {
    counts[f._check] = (counts[f._check] || 0) + 1;
    (checkMods[f._check] = checkMods[f._check] || new Set()).add(f.module);
  }
  const keys = Object.keys(counts).sort();
  const bar = document.getElementById('checkfilter');
  bar.innerHTML = '';
  if (keys.length <= 1) return;

  const label = document.createElement('span');
  label.className = 'checkbar-label';
  label.textContent = 'checks:';
  bar.appendChild(label);

  for (const k of keys) {
    const b = document.createElement('button');
    if (excludedChecks.has(k)) b.classList.add('off');
    b.innerHTML = ratingDot(maxRating([...checkMods[k]])) + checkLabel(k) + '<span class="count">' + counts[k] + '</span>';
    b.title = (excludedChecks.has(k) ? 'Click to show' : 'Click to hide') + ' — ' + k;
    b.onclick = () => {
      if (excludedChecks.has(k)) excludedChecks.delete(k); else excludedChecks.add(k);
      renderAll();
    };
    bar.appendChild(b);
  }
  if (keys.some(k => excludedChecks.has(k))) {
    const clr = document.createElement('button');
    clr.className = 'checkbar-clear';
    clr.textContent = 'reset';
    clr.onclick = () => { excludedChecks.clear(); renderAll(); };
    bar.appendChild(clr);
  }
}

function renderToolbar() {
  const fpView = currentSection === FP_SECTION;
  const show = (id, on) => document.getElementById(id).style.display = on ? '' : 'none';
  show('restore-all', fpView);
  show('export-raw', !fpView);
  show('export-assets', !fpView);
  // Curls only exist for a few modules (e.g. blob_anon); offer the export only
  // when the current view actually contains curl-bearing findings.
  const curlish = !fpView && currentRows().some(f => f.detail && f.detail.curl);
  show('export-curls', curlish);
}

// ---- Table (persistent column widths survive re-renders) -----------------
const colDefs = [
  {name: '', width: 30},
  {name: 'severity', width: 80},
  {name: 'subscription', width: 110},
  {name: 'region', width: 120},
  {name: 'module', width: 130},
  {name: 'title', width: 400},
  {name: 'resource', width: 250},
  {name: 'raw', width: 50},
  {name: 'detail', width: 80}
];
const colWidths = colDefs.map(c => c.width);
let currentTable = null;

function buildTableHeader() {
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const ths = colDefs.map((col, ci) => {
    const th = document.createElement('th');
    th.textContent = col.name;
    th.style.width = colWidths[ci] + 'px';
    th.style.position = 'relative';
    headerRow.appendChild(th);
    return th;
  });
  // Attach resizers in a second pass so each one knows its right-hand neighbor.
  // Dragging the resizer between column ci and ci+1 grows ci and shrinks ci+1
  // by the same amount, keeping the total table width constant.
  ths.forEach((th, ci) => {
    if (ci >= ths.length - 1) return; // last column has no right neighbor
    const rightTh = ths[ci + 1];
    const resizer = document.createElement('div');
    resizer.className = 'resizer';
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      const startX = e.pageX;
      const startW1 = colWidths[ci];
      const startW2 = colWidths[ci + 1];
      const minW = 30;
      resizer.classList.add('active');
      const onMove = e2 => {
        let dx = e2.pageX - startX;
        if (startW1 + dx < minW) dx = minW - startW1;
        if (startW2 - dx < minW) dx = startW2 - minW;
        const w1 = startW1 + dx;
        const w2 = startW2 - dx;
        th.style.width = w1 + 'px';
        rightTh.style.width = w2 + 'px';
        colWidths[ci] = w1;
        colWidths[ci + 1] = w2;
      };
      const onUp = () => {
        resizer.classList.remove('active');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    th.appendChild(resizer);
  });
  thead.appendChild(headerRow);
  tbl.appendChild(thead);
  return tbl;
}

function renderTable() {
  const fpView = currentSection === FP_SECTION;
  const rows = currentRows();
  const content = document.getElementById('content');
  if (rows.length === 0) {
    content.textContent = fpView ? 'no false positives' : 'no findings';
    currentTable = null;
    return;
  }
  if (!currentTable || !content.contains(currentTable)) {
    currentTable = buildTableHeader();
    content.innerHTML = '';
    content.appendChild(currentTable);
  }
  const oldTbody = currentTable.querySelector('tbody');
  if (oldTbody) oldTbody.remove();

  const tbody = document.createElement('tbody');
  const frag = document.createDocumentFragment();
  for (const f of rows) {
    const tr = document.createElement('tr');
    tr.id = 'row-' + f.id;

    // Hide (→ false positive) or Restore button.

    }
    actCell.appendChild(actBtn);
    tr.appendChild(actCell);

    const sevCell = document.createElement('td');

    if (f.detail && f.detail.curl) {
      const curls = Array.isArray(f.detail.curl) ? f.detail.curl : [f.detail.curl];
      for (const c of curls) {

        block.appendChild(btn);
        titleCell.appendChild(block);
      }
    }
    tr.appendChild(titleCell);

    const resCell = document.createElement('td');
    resCell.textContent = f.resource_id || '';
    tr.appendChild(resCell);

    const rawCell = document.createElement('td');
    if (f.raw_output_path) {
      const a = document.createElement('a');
      a.href = f.raw_output_path;
      a.target = '_blank';
      a.textContent = 'browse';

// ---- Exports (operate on what's actually shown: current section/module,
// minus false positives, minus checks toggled off, minus the text filter) ----
function visibleForExport() {
  const section = currentSection === FP_SECTION ? '' : currentSection;
  let rows = applyCheckFilter(rowsForSection(section, currentModule, false));
  const filter = document.getElementById('filter').value.toLowerCase();
  if (filter) rows = rows.filter(f => f._search.includes(filter));
  return rows;
}

function exportCurls() {
  const lines = [];
  for (const f of visibleForExport()) {
    if (!f.detail || !f.detail.curl) continue;
    const curls = Array.isArray(f.detail.curl) ? f.detail.curl : [f.detail.curl];
    lines.push('# ' + f.title + ' [' + f.severity + '] ' + f.subscription_id + ' ' + f.region);
    for (const c of curls) lines.push(c);
    lines.push('');
  }
  if (lines.length === 0) { alert('No curl commands found in visible findings.'); return; }
  downloadText(lines.join('\n'), 'ballmerbuster-curls.txt');
}

function exportRaw() {
  const data = visibleForExport();
  if (data.length === 0) { alert('No visible findings to export.'); return; }
  downloadText(JSON.stringify(data, null, 2), 'ballmerbuster-' + (currentModule || currentSection || 'all') + '.json', 'application/json');
}

function extractAsset(f) {
  const d = f.detail || {};
  switch (f.module) {
    case 'blob_anon':
      if (d.list_curl) return d.list_curl;
      if (d.curl) {
        const curls = Array.isArray(d.curl) ? d.curl : [d.curl];
        const urls = curls.map(c => { const m = c.match(/'([^']+)'/); return m ? m[1] : null; }).filter(Boolean);
        if (urls.length) return urls.join('\n');
      }
      return d.account_name ? d.account_name + '/' + (d.container_name || '') : f.resource_id || '';
    case 'public_sql':
      return d.fqdn || d.server_name || f.resource_id || '';
    case 'nsg_exposure':
      return d.nsg_name ? d.nsg_name + ' / ' + (d.rule_name || '') : f.resource_id || '';
    case 'function_app_env':
      return d.app_name || f.resource_id || '';
    case 'entra_id':
      return d.display_name || d.app_id || f.resource_id || '';
    case 'subdomain_takeover':
      return d.record_name || d.cname || f.resource_id || '';
    case 'keyvault_exposure':
      return d.vault_name || f.resource_id || '';
    case 'acr_exposure':
      return d.registry_name || f.resource_id || '';
    case 'rbac_review':
      return d.role_name || d.principal_id || f.resource_id || '';
    default:
      return f.resource_id || f.title || '';
  }
}

function exportAssets() {
  const seen = new Set();
  const lines = [];
  for (const f of visibleForExport()) {
    const asset = extractAsset(f);
    if (!asset) continue;
    for (const line of asset.split('\n')) {
      const trimmed = line.trim();
      if (trimmed && !seen.has(trimmed)) { seen.add(trimmed); lines.push(trimmed); }
    }
  }
  if (lines.length === 0) { alert('No assets found in visible findings.'); return; }
  downloadText(lines.join('\n') + '\n', 'ballmerbuster-' + (currentModule || currentSection || 'all') + '-assets.txt');
}

function downloadText(text, name, type) {
  const blob = new Blob([text], {type: type || 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---- Utils → TREVORspray -------------------------------------------------
// Parses a POST Server-Sent-Events stream (EventSource only does GET). Frames
// are `event: <name>\ndata: <payload>\n\n`; `line` payloads have newlines
// backslash-escaped by the server, so we unescape them for the console.
async function sseFetch(url, body, handlers) {
  let resp;
  try {
    resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}), signal: handlers.signal });
  } catch (e) { handlers.onError && handlers.onError(String(e)); return; }
  if (!resp.ok || !resp.body) {
    const t = await resp.text().catch(() => '');
    handlers.onError && handlers.onError('HTTP ' + resp.status + (t ? ' — ' + t : ''));
    return;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    let chunk;
    try { chunk = await reader.read(); } catch (e) { break; }
    if (chunk.done) break;
    buf += dec.decode(chunk.value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
      let ev = 'message', data = '';
      frame.split('\n').forEach(l => {
        if (l.startsWith('event:')) ev = l.slice(6).trim();
        else if (l.startsWith('data:')) data += l.slice(5).replace(/^ /, '');
      });
      if (ev === 'line') handlers.onLine && handlers.onLine(data.replace(/\\n/g, '\n'));
      else if (ev === 'done') { let d = {}; try { d = JSON.parse(data); } catch {} handlers.onDone && handlers.onDone(d); }
    }
  }
}

// xterm 256-colour index → CSS colour. TREVORspray's logger emits
// `\x1b[1;38;5;<N>m` sequences, so we need the full 256-colour cube.
function xterm256(n) {
  if (n < 16) return ['#000000','#cd0000','#00cd00','#cdcd00','#0000ee','#cd00cd','#00cdcd','#e5e5e5',
    '#7f7f7f','#ff5b5b','#5bff5b','#ffff5b','#5c9cff','#ff5bff','#5bffff','#ffffff'][n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return 'rgb(' + v + ',' + v + ',' + v + ')'; }
  n -= 16;
  const s = [0, 95, 135, 175, 215, 255];
  return 'rgb(' + s[Math.floor(n / 36) % 6] + ',' + s[Math.floor(n / 6) % 6] + ',' + s[n % 6] + ')';
}

// ansiAppend renders text with ANSI SGR codes into `el` as coloured spans,
// carrying style state across calls (output arrives line by line). Caps the
// node count so a long spray can't grow the DOM without bound.
function ansiAppend(el, text) {
  const st = el._ansi || (el._ansi = { fg: null, bold: false });
  // Only pin to the bottom if the viewer is already there — so scrolling up
  // to read earlier output during a live run isn't yanked back down.
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  const re = /\x1b\[([0-9;]*)m/g;
  let last = 0, m;
  const emit = (str) => {
    if (!str) return;
    const span = document.createElement('span');
    if (st.fg) span.style.color = st.fg;
    if (st.bold) span.style.fontWeight = '700';
    span.textContent = str;
    el.appendChild(span);
  };
  while ((m = re.exec(text))) {
    emit(text.slice(last, m.index));
    last = re.lastIndex;
    let codes = m[1].split(';').filter(x => x !== '').map(Number);
    if (!codes.length) codes = [0];
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === 0) { st.fg = null; st.bold = false; }
      else if (c === 1) st.bold = true;
      else if (c === 22) st.bold = false;
      else if (c === 39) st.fg = null;
      else if (c === 38 && codes[i + 1] === 5) { st.fg = xterm256(codes[i + 2] || 0); i += 2; }
      else if (c >= 30 && c <= 37) st.fg = xterm256(c - 30);
      else if (c >= 90 && c <= 97) st.fg = xterm256(c - 90 + 8);
    }
  }
  emit(text.slice(last));
  while (el.childNodes.length > 5000) el.removeChild(el.firstChild);
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function appendConsole(id, txt) {

}

        '<label><input type="checkbox" id="ts-verbose"> Verbose</label>' +
      '</div>' +
      '<div class="u-hint">MFA note: the <code>msol</code> module reports each account&#39;s status (valid / invalid / locked / <strong>MFA enabled</strong>). Different modules hit different endpoints — some legacy auth paths do not enforce MFA, so switching module is the MFA-bypass lever.</div>' +
      '<div class="u-row"><button class="btn" id="ts-run-btn" disabled>Run TREVORspray</button><button class="btn btn-warn" id="ts-stop-btn" style="display:none">Stop</button></div>' +
      '<div class="term" id="ts-run-term" style="display:none">' +
        '<div class="term-bar" id="ts-run-bar"><span class="dot"></span><span class="title">trevorspray</span><span class="state">idle</span><span class="spacer"></span><span id="ts-run-links"></span><button onclick="copyTerm(\'ts-run-body\',this)">copy</button><button onclick="document.getElementById(\'ts-run-body\').textContent=\'\'">clear</button></div>' +
        '<div class="term-body" id="ts-run-body"></div>' +
      '</div>' +
    '</div>';

  // Wire up.
  document.getElementById('ts-install-btn').onclick = () => {
    const btn = document.getElementById('ts-install-btn');
    document.getElementById('ts-install-term').style.display = '';
    document.getElementById('ts-install-body').textContent = '';
    btn.disabled = true;
    setTermState('ts-install-bar', 'running', 'installing…');
    sseFetch('/api/utils/trevorspray/install', {}, {
      onLine: t => appendConsole('ts-install-body', t + '\n'),
      onError: e => { appendConsole('ts-install-body', '[error] ' + e + '\n'); setTermState('ts-install-bar', 'fail', 'error'); btn.disabled = false; },
      onDone: d => { setTermState('ts-install-bar', d.ok ? 'ok' : 'fail', d.ok ? 'installed ✓' : 'failed (exit ' + d.exit + ')'); btn.disabled = false; tsCheckStatus(); },
    });
  };

  document.getElementById('dh-btn').onclick = async () => {
    const btn = document.getElementById('dh-btn');
    const out = document.getElementById('dh-result');
    btn.disabled = true; out.innerHTML = '<span class="muted">querying DeHashed…</span>';
    try {
      const resp = await fetch('/api/utils/trevorspray/dehashed', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          endpoint: document.getElementById('dh-endpoint').value.trim(),
          api_key: document.getElementById('dh-key').value,
          email: document.getElementById('dh-email').value.trim(),
          domain: document.getElementById('dh-domain').value,
          size: parseInt(document.getElementById('dh-size').value, 10) || 100,
        }),
      });
      if (!resp.ok) { out.innerHTML = '<span class="no">' + esc(await resp.text()) + '</span>'; renderDhTable(null); return; }
      const d = await resp.json();
      renderDhResult(d);
      renderDhTable(d);
      if (d.users && d.users.length) setUsers(d.users.join('\n'));
      // Prefill the recon domain box with the queried tenants if it's empty.
      const doms = (d.domains && d.domains.length) ? d.domains : splitDomains(document.getElementById('dh-domain').value);
      if (doms.length && !document.getElementById('ts-domain').value.trim()) document.getElementById('ts-domain').value = doms.join('\n');
      loadUserlists();
    } catch (e) {
      out.innerHTML = '<span class="no">' + esc(String(e)) + '</span>'; renderDhTable(null);
    } finally { btn.disabled = false; }
  };

  document.getElementById('dh-csv-btn').onclick = () => downloadDhCsv();

  document.getElementById('ts-run-btn').onclick = () => {
    const mode = (document.querySelector('input[name="ts-mode"]:checked') || {}).value || 'spray';
    // Guardrail: hitting a live tenant risks account lockouts. Show the attempt
    // math and require confirmation before any credential is sent.
    const max = parseInt(document.getElementById('ts-max').value, 10) || 2;
    const doms = splitDomains(document.getElementById('ts-domain').value);
    const target = (doms.length ? doms.join(', ') : '') || document.getElementById('ts-url').value.trim() || 'the configured endpoint';
    if (mode === 'combo') {
      const st = comboStats(document.getElementById('ts-combos').value, max);
      if (!st.pairs) { alert('Add at least one user:password pair.'); return; }
      if (!confirm('Authorized testing only — confirm you have permission to test this tenant.\n\n' +
        st.attempts + ' credential pair(s) across ' + st.users + ' user(s)' +
        (st.dropped ? ' (' + st.dropped + ' dropped by the ' + max + '/user cap)' : '') +
        ' against ' + target + '.\n\nProceed?')) return;
    } else if (mode !== 'recon') {
      const nu = countLines(document.getElementById('ts-users').value);
      const np = countLines(document.getElementById('ts-passwords').value);
      if (!nu || !np) { alert('Add at least one user and one password.'); return; }
      const perUser = Math.min(np, max);
      const total = (mode === 'test' ? 1 : nu) * perUser;
      if (!confirm('Authorized testing only — confirm you have permission to spray this tenant.\n\n' +
        (mode === 'test' ? '1 test user' : nu + ' users') + ' × ' + perUser + ' password(s) = ' + total +
        ' login attempt(s) against ' + target + '.\n\nProceed?')) return;
    }
    document.getElementById('ts-run-term').style.display = '';
    document.getElementById('ts-run-body').textContent = '';
    document.getElementById('ts-run-links').innerHTML = '';
    const body = {
      mode,
      module: document.getElementById('ts-module').value,
      domain: document.getElementById('ts-domain').value,
      url: document.getElementById('ts-url').value.trim(),
      user_enum: document.getElementById('ts-userenum').value,
      users: [document.getElementById('ts-users').value],
      passwords: [document.getElementById('ts-passwords').value],
      combos: [document.getElementById('ts-combos').value],
      max_attempts: parseInt(document.getElementById('ts-max').value, 10) || 2,
      delay: parseFloat(document.getElementById('ts-delay').value) || 0,
      lockout_delay: parseFloat(document.getElementById('ts-lockdelay').value) || 0,
      jitter: parseFloat(document.getElementById('ts-jitter').value) || 0,
      threads: parseInt(document.getElementById('ts-threads').value, 10) || 1,
      exit_on_success: document.getElementById('ts-exit').checked,
      ignore_lockouts: document.getElementById('ts-ignorelock').checked,
      force: document.getElementById('ts-force').checked,
      verbose: document.getElementById('ts-verbose').checked,
    };
    const runBtn = document.getElementById('ts-run-btn');
    const stopBtn = document.getElementById('ts-stop-btn');
    _tsRunAbort = new AbortController();
    runBtn.disabled = true; stopBtn.style.display = '';
    // Live elapsed timer in the terminal bar.
    const t0 = Date.now();
    clearInterval(_tsTimer);
    _tsTimer = setInterval(() => setTermState('ts-run-bar', 'running', mode + ' · running ' + Math.round((Date.now() - t0) / 1000) + 's'), 1000);
    setTermState('ts-run-bar', 'running', mode + ' · running 0s');
    const finish = (cls, label, d) => {
      clearInterval(_tsTimer);
      const secs = Math.round((Date.now() - t0) / 1000);
      setTermState('ts-run-bar', cls, label + ' · ' + secs + 's');
      runBtn.disabled = false; stopBtn.style.display = 'none'; _tsRunAbort = null;
      if (d && (d.log || d.run_dir)) {
        document.getElementById('ts-run-links').innerHTML =
          (d.run_dir ? '<a href="' + esc(d.run_dir) + '" target="_blank" rel="noopener">output dir</a> · ' : '') +
          (d.log ? '<a href="' + esc(d.log) + '" target="_blank" rel="noopener">run log</a> · ' : '') +
          (d.tool_log ? '<a href="' + esc(d.tool_log) + '" target="_blank" rel="noopener">tool log</a> ' : '');
      }
    };
    sseFetch('/api/utils/trevorspray/run', body, {
      signal: _tsRunAbort.signal,
      onLine: t => appendConsole('ts-run-body', t + '\n'),
      onError: e => { appendConsole('ts-run-body', '[error] ' + e + '\n'); finish('fail', 'error'); },
      onDone: d => { finish(d.ok ? 'ok' : 'fail', d.ok ? 'finished (exit 0)' : 'exit ' + d.exit, d); },
    });
  };

  document.getElementById('ts-stop-btn').onclick = () => {
    if (_tsRunAbort) {
      _tsRunAbort.abort();
      appendConsole('ts-run-body', '\n[stopped by user]\n');
      clearInterval(_tsTimer);
      setTermState('ts-run-bar', 'fail', 'stopped');
      document.getElementById('ts-run-btn').disabled = false;
      document.getElementById('ts-stop-btn').style.display = 'none';
      _tsRunAbort = null;
    }
  };

  // Reveal / hide the DeHashed API key.
  document.getElementById('dh-key-toggle').onclick = () => {
    const inp = document.getElementById('dh-key');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    document.getElementById('dh-key-toggle').textContent = show ? 'hide' : 'show';
  };

  // Persist non-secret settings across reloads (never the API key, email, or
  // the user/password lists).
  restoreTsSettings();
  document.getElementById('utils').addEventListener('change', saveTsSettings);
  document.getElementById('utils').addEventListener('input', e => { if (TS_PERSIST.has(e.target.id)) saveTsSettings(); });

  // Live user/password/combo counters — show the effective per-user attempts.
  const countLines = s => s.split('\n').map(x => x.trim()).filter(Boolean).length;
  const updateCounts = () => {
    const nu = countLines(document.getElementById('ts-users').value);
    const np = countLines(document.getElementById('ts-passwords').value);
    const max = parseInt(document.getElementById('ts-max').value, 10) || 2;
    document.getElementById('ts-users-count').textContent = nu + ' user' + (nu === 1 ? '' : 's');
    const eff = Math.min(np, max);
    document.getElementById('ts-pass-count').innerHTML = np + ' password' + (np === 1 ? '' : 's') +
      (np > max ? ' <span class="no">→ capped to ' + eff + '/user</span>' : ' <span class="muted">→ ' + eff + '/user</span>');
    const cs = comboStats(document.getElementById('ts-combos').value, max);
    document.getElementById('ts-combo-count').innerHTML = cs.pairs + ' pair' + (cs.pairs === 1 ? '' : 's') + ' · ' +
      cs.users + ' user' + (cs.users === 1 ? '' : 's') +
      (cs.dropped ? ' <span class="no">→ ' + cs.dropped + ' dropped (' + max + '/user)</span>'
                  : ' <span class="muted">→ ' + cs.attempts + ' attempt' + (cs.attempts === 1 ? '' : 's') + '</span>');
  };
  ['ts-users', 'ts-passwords', 'ts-max', 'ts-combos'].forEach(id => document.getElementById(id).addEventListener('input', updateCounts));
  document.querySelectorAll('input[name="ts-mode"]').forEach(r => r.addEventListener('change', () => { updateModeVisibility(); updateCounts(); }));
  updateModeVisibility();
  updateCounts();

  tsCheckStatus();
  loadUserlists();
}

// setUsers fills the users box and refreshes the derived counters.
function setUsers(text) {
  const el = document.getElementById('ts-users');
  if (!el) return;
  el.value = text;
  el.dispatchEvent(new Event('input'));
}

// ---- DeHashed credential table + export ----------------------------------
// The last DeHashed fetch's full records, kept in memory so Export CSV emits
// exactly what's shown (and works even without the server-side file link).
let _dhRecords = [];

// splitDomains parses the multi-domain boxes the same way the server does.
function splitDomains(s) {
  return (s || '').split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean)
    .filter((v, i, a) => a.indexOf(v) === i);
}

function basename(p) { return (p || '').split('/').pop(); }

// comboStats summarizes a user:password combo list, mirroring the server-side
// per-user attempt cap so the confirmation and counters match what will run.
function comboStats(text, max) {
  const counts = {};
  let pairs = 0, attempts = 0, dropped = 0;
  for (let line of (text || '').split('\n')) {
    line = line.trim();
    if (!line || line.indexOf(':') < 0) continue;
    pairs++;
    const u = line.slice(0, line.indexOf(':')).toLowerCase();
    counts[u] = (counts[u] || 0) + 1;
    if (counts[u] <= max) attempts++; else dropped++;
  }
  return { pairs, users: Object.keys(counts).length, attempts, dropped };
}

// updateModeVisibility shows only the input boxes relevant to the chosen mode:
// recon → users (optional, for enum); spray/test → users + passwords;
// combo → the user:password box.
function updateModeVisibility() {
  const mode = (document.querySelector('input[name="ts-mode"]:checked') || {}).value || 'spray';
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; };
  show('ts-users-block', mode === 'spray' || mode === 'test' || mode === 'recon');
  show('ts-pass-block', mode === 'spray' || mode === 'test');
  show('ts-combo-block', mode === 'combo');
}

// Columns rendered in the credential table and CSV (key → header label).
const DH_COLS = [
  ['domain', 'Domain'], ['email', 'Email'], ['username', 'Username'], ['password', 'Password'],
  ['hashed_password', 'Hash'], ['name', 'Name'], ['database_name', 'Database'], ['ip_address', 'IP'], ['phone', 'Phone'],
];

function renderDhResult(d) {
  const out = document.getElementById('dh-result');
  if (!d || (!d.count && !d.record_count)) { out.innerHTML = '<span class="no">no records found</span>'; return; }
  let html = '<div class="u-hint">Found <strong>' + (d.record_count || 0) + '</strong> record(s), <strong>' + (d.count || 0) +
    '</strong> unique ' + esc(d.kind || 'user') + '(s) (' + (d.emails || 0) + ' emails, ' + (d.usernames || 0) + ' usernames' +
    (d.total != null ? ', ' + esc(String(d.total)) + ' total matches' : '') + ').';
  // Flag when the API reports more matches than we fetched, so the operator
  // knows to raise Max results (subject to DeHashed's 10k/query cap).
  const totalNum = Number(d.total);
  if (Number.isFinite(totalNum) && totalNum > (d.record_count || 0)) {
    html += ' <span class="no">⚠ ' + (totalNum - d.record_count) + ' more available — raise Max results to fetch them.</span>';
  }
  if (d.saved_url) html += ' Userlist: <a href="' + esc(d.saved_url) + '" target="_blank" rel="noopener">' + esc(basename(d.saved_path)) + '</a>.';
  if (d.csv_url) html += ' Saved CSV: <a href="' + esc(d.csv_url) + '" target="_blank" rel="noopener">' + esc(basename(d.csv_path)) + '</a>.';
  html += ' Users loaded below.</div>';
  if (d.per_domain && d.per_domain.length > 1) {
    html += '<div class="dh-perdom">' + d.per_domain.map(pd =>
      '<span class="u-tag' + (pd.error ? ' bad' : '') + '">' + esc(pd.domain || '(query)') + ': ' +
      (pd.error ? esc(pd.error) : (pd.records + ' rec · ' + pd.users + ' user' + (pd.users === 1 ? '' : 's'))) + '</span>').join(' ') + '</div>';
  }
  out.innerHTML = html;
}

function renderDhTable(d) {
  _dhRecords = (d && d.records) || [];
  const wrap = document.getElementById('dh-table-wrap');
  const table = document.getElementById('dh-table');
  const csvBtn = document.getElementById('dh-csv-btn');
  if (!_dhRecords.length) { wrap.style.display = 'none'; table.innerHTML = ''; csvBtn.style.display = 'none'; return; }
  // Only show columns that carry data in this result set.
  const cols = DH_COLS.filter(([k]) => _dhRecords.some(r => (r[k] || '') !== ''));
  const cap = 1000;
  const rows = _dhRecords.slice(0, cap);
  let html = '';
  if (_dhRecords.length > cap) html += '<caption class="dh-cap">showing first ' + cap + ' of ' + _dhRecords.length + ' rows — Export CSV for all</caption>';
  html += '<thead><tr>' + cols.map(([, label]) => '<th>' + esc(label) + '</th>').join('') + '</tr></thead><tbody>';
  html += rows.map(r => '<tr>' + cols.map(([k]) => '<td>' + esc(r[k] || '') + '</td>').join('') + '</tr>').join('');
  html += '</tbody>';
  table.innerHTML = html;
  wrap.style.display = '';
  csvBtn.style.display = '';
}

// Build a CSV from the in-memory records and trigger a client-side download.
function downloadDhCsv() {
  if (!_dhRecords.length) return;
  const escCell = v => { v = (v == null ? '' : String(v)); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [DH_COLS.map(([, label]) => label).join(',')];
  for (const r of _dhRecords) lines.push(DH_COLS.map(([k]) => escCell(r[k])).join(','));
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dehashed-export.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// loadUserlists shows the userlist files already saved under the engagement,
// each with a Load button that repopulates the users box from disk.
async function loadUserlists() {
  const el = document.getElementById('dh-userlists');
  if (!el) return;
  let lists = [];
  try { lists = await fetch('/api/utils/trevorspray/userlists').then(r => r.json()) || []; } catch { return; }
  if (!lists.length) { el.innerHTML = ''; return; }
  el.innerHTML = 'Saved userlists: ' + lists.map((l, i) =>
    '<span class="u-tag"><button data-i="' + i + '">' + esc(l.name) + ' (' + l.count + ')</button></span>').join(' ');
  el.querySelectorAll('button[data-i]').forEach(b => {
    b.onclick = async () => {
      const l = lists[+b.dataset.i];
      try { setUsers((await fetch(l.raw_url).then(r => r.text())).trim()); } catch {}
    };
  });
}

// Non-secret settings persisted across reloads (localStorage). The API key,
// email, and the user/password lists are deliberately never stored.
const TS_KEEP = ['dh-endpoint', 'dh-domain', 'dh-size', 'ts-module', 'ts-domain', 'ts-url', 'ts-userenum', 'ts-max', 'ts-delay', 'ts-lockdelay', 'ts-jitter', 'ts-threads'];
const TS_CHECK = ['ts-exit', 'ts-ignorelock', 'ts-force', 'ts-verbose'];
const TS_PERSIST = new Set([...TS_KEEP, ...TS_CHECK]);
function saveTsSettings() {
  const o = {};
  TS_KEEP.forEach(id => { const el = document.getElementById(id); if (el) o[id] = el.value; });
  TS_CHECK.forEach(id => { const el = document.getElementById(id); if (el) o[id] = el.checked; });
  const m = document.querySelector('input[name="ts-mode"]:checked'); if (m) o.mode = m.value;
  try { localStorage.setItem('bb_trevorspray', JSON.stringify(o)); } catch {}
}
function restoreTsSettings() {
  let o = {};
  try { o = JSON.parse(localStorage.getItem('bb_trevorspray') || '{}'); } catch {}
  TS_KEEP.forEach(id => { if (o[id] != null) { const el = document.getElementById(id); if (el) el.value = o[id]; } });
  TS_CHECK.forEach(id => { if (o[id] != null) { const el = document.getElementById(id); if (el) el.checked = o[id]; } });
  if (o.mode) { const r = document.querySelector('input[name="ts-mode"][value="' + o.mode + '"]'); if (r) r.checked = true; }
}

// ---- Boot ----------------------------------------------------------------
// Debounce the text filter so typing only rebuilds the table body once the
// user pauses, keeping keystrokes responsive on large finding sets.
let filterTimer = null;
document.getElementById('filter').addEventListener('input', () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => { currentTable = null; renderTable(); renderSummary(); renderToolbar(); }, 120);
});

async function boot() {
  const summary = await fetch('/api/summary').then(r => r.json());
  categories = summary.categories || [];
  for (const m of (summary.modules || [])) {
    moduleCategory[m.module] = m.category || 'other';
    moduleRating[m.module] = m.rating || 'medium';
  }
  allFindings = await fetch('/api/findings').then(r => r.json()) || [];
  // Precompute a lowercase search blob per finding so the text filter never
  // re-stringifies on every keystroke.
  for (const f of allFindings) {
    f._search = JSON.stringify(f).toLowerCase();
    f._check = checkKey(f);
  }
  renderAll();
  renderTopTabs();
}
boot();
</script>
